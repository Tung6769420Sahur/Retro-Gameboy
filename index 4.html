<script>

const G={};
let HS={dk:0,pl:0,te:0,sn:0,tt:0};try{Object.assign(HS,JSON.parse(localStorage.getItem('ph_hs')||'{}'))}catch(e){}

/* ---------- FASSALARM (Donkey-Kong-Stil mit Hammer) ---------- */
G.dk=(()=>{
 const P=[[0,240,300,300],[0,215,252,262],[25,240,222,212],[0,215,172,182],[25,240,142,132],[0,215,92,102]].map(a=>({x1:a[0],x2:a[1],yl:a[2],yr:a[3]}));
 const yAt=(p,x)=>p.yl+(p.yr-p.yl)*(x-p.x1)/(p.x2-p.x1);
 const LD=[[190,0,1],[50,1,2],[180,2,3],[45,3,4],[150,4,5]].map(a=>({x:a[0],lo:a[1],hi:a[2],top:yAt(P[a[2]],a[0]),bot:yAt(P[a[1]],a[0])}));
 let pl,B,hm,sp,sc,li,lv,msg,mt,st,hs=300;
 function rst(){pl={x:20,y:300,vy:0,vx:0,p:0,cl:null,f:1,h:0};B=[];sp=60;hm=[];spawnH();spawnH();hs=480}
 function spawnH(){const p=1+Math.random()*4|0,q=P[p];hm.push({x:q.x1+20+Math.random()*(q.x2-q.x1-40)|0,p,on:1})}
 function die(){li--;if(li<=0)st='over';else{msg=70;mt='Autsch!'}rst()}
 function bump(py){if(pl.vy<0)for(const p of P)if(pl.x>=p.x1&&pl.x<=p.x2){const ya=yAt(p,pl.x);if(py-14>=ya+5&&pl.y-14<ya+5){pl.y=ya+19;pl.vy=0}}}
 function mantle(){if(pl.vy>1)return 0;for(let i=0;i<P.length;i++){const p=P[i];for(const e of[p.x1,p.x2]){const o=e==p.x2?pl.x-e:e-pl.x;if(o>0&&o<8){const ya=yAt(p,e);if(pl.y>=ya+1&&pl.y<=ya+18){pl.p=i;pl.x=e==p.x2?e-3:e+3;pl.y=yAt(p,pl.x);pl.vy=0;pl.vx=0;return 1}}}}return 0}
 function init(){sc=0;li=3;lv=1;msg=0;st='play';rst()}
 function step(){
  if(st=='over'){if(PR.a)init();return}
  if(msg>0){msg--;return}
  const L=K.l,Rr=K.r,U=K.u,D=K.d,jp=PR.a||PR.b;
  if(pl.cl){const l=pl.cl;pl.x=l.x;if(U)pl.y-=1.2;if(D)pl.y+=1.2;
   if(pl.y<=l.top){pl.y=l.top;pl.p=l.hi;pl.cl=null}else if(pl.y>=l.bot){pl.y=l.bot;pl.p=l.lo;pl.cl=null}}
  else if(pl.p>=0){
   const p=P[pl.p];
   if(L){pl.x-=1.3;pl.f=-1}if(Rr){pl.x+=1.3;pl.f=1}
   pl.x=Math.max(p.x1,Math.min(p.x2,pl.x));pl.y=yAt(p,pl.x);
   for(const h of hm)if(h.on&&h.p==pl.p&&Math.abs(h.x-pl.x)<8){h.on=0;pl.h=300;hs=480}
   {
    for(const l of LD)if(!pl.h&&Math.abs(pl.x-l.x)<6&&((U&&pl.p==l.lo)||(D&&pl.p==l.hi))){pl.y=pl.p==l.lo?l.bot:l.top;pl.cl=l;pl.p=-1;pl.x=l.x;break}
    if(jp&&pl.p>=0){pl.vy=pl.h?-4.6:-3.2;pl.vx=(Rr-L)*1.3;pl.p=-1}
   }
  }else{
   pl.x=Math.max(2,Math.min(W-2,pl.x+pl.vx));pl.vy+=.2;const py=pl.y;pl.y+=pl.vy;bump(py);
   if(!mantle()&&pl.vy>0)for(let i=0;i<P.length;i++){const p=P[i];if(pl.x>=p.x1&&pl.x<=p.x2){const ya=yAt(p,pl.x);if(py<=ya+1&&pl.y>=ya){pl.p=i;pl.y=ya;pl.vy=0;break}}}
   if(pl.y>H+20){die();return}
  }
  if(pl.h>0)pl.h--;else if(!hm.some(h=>h.on)&&--hs<=0){spawnH();hs=480}
  if(pl.p==5&&pl.x>=195){sc+=500;lv++;msg=70;mt='Geschafft!';rst();return}
  if(--sp<=0){B.push({x:50,y:yAt(P[5],50)-4,p:5,vy:0,a:0,vx:0,ps:0,r:0});sp=Math.max(40,110-lv*12)}
  const bs=1+lv*.15;
  for(const b of B){
   b.r+=.2;
   if(!b.a){const p=P[b.p],d=p.yr>p.yl?1:-1;b.x+=d*bs;b.vx=d;if(b.x<p.x1||b.x>p.x2){b.a=1;b.vy=0}else b.y=yAt(p,b.x)-4}
   else{b.x+=b.vx*.8;b.vy+=.2;const py=b.y+4;b.y+=b.vy;
    for(let i=0;i<P.length;i++){const p=P[i];if(b.x>=p.x1&&b.x<=p.x2){const ya=yAt(p,b.x);if(py<=ya+1&&b.y+4>=ya){b.p=i;b.a=0;b.y=ya-4;break}}}}
   if(pl.h>0){const hx=pl.x+pl.f*14;if(Math.abs(b.x-hx)<12&&Math.abs(b.y-(pl.y-8))<12){b.dead=1;sc+=300;continue}}
   const dx=Math.abs(b.x-pl.x),dy=(pl.y-7)-b.y;
   if(dx<7&&Math.abs(dy)<8){die();return}
   if(!b.ps&&pl.p<0&&!pl.cl&&dx<5&&pl.y<b.y-3&&pl.y>b.y-30){b.ps=1;sc+=100}
  }
  B=B.filter(b=>!b.dead&&b.y<H+20&&b.x>-12&&b.x<W+12);
 }
 function draw(){
  R(0,0,W,H,C[0]);
  for(const l of LD){for(let y=l.top;y<l.bot;y+=4)R(l.x-5,y,10,1,C[2]);R(l.x-5,l.top,1,l.bot-l.top,C[2]);R(l.x+4,l.top,1,l.bot-l.top,C[2])}
  for(const p of P){g.fillStyle='#e63946';g.beginPath();g.moveTo(p.x1,p.yl);g.lineTo(p.x2,p.yr);g.lineTo(p.x2,p.yr+5);g.lineTo(p.x1,p.yl+5);g.fill();for(let x=p.x1+6;x<p.x2;x+=16)R(x,yAt(p,x)+2,2,2,'#ffd166')}
  const gy=yAt(P[5],34),up=sp<18;
  R(22,gy-24,26,24,'#8d5524');R(28,gy-35,14,12,'#8d5524');R(14,gy-(up?36:22),9,up?20:16,'#b5651d');R(47,gy-(up?36:22),9,up?20:16,'#b5651d');R(31,gy-31,8,6,'#deb887');R(27,gy-20,16,10,'#deb887');R(32,gy-30,2,2,'#111');R(36,gy-30,2,2,'#111');
  T('★',205,yAt(P[5],205)-6,'#ffd166',16);
  for(const h of hm)if(h.on){const y=yAt(P[h.p],h.x);R(h.x-1,y-9,2,9,'#c68642');R(h.x-5,y-13,10,5,'#adb5bd')}
  for(const b of B){g.fillStyle='#b5651d';g.beginPath();g.arc(b.x,b.y,4,0,7);g.fill();g.strokeStyle='#5c3317';g.beginPath();g.moveTo(b.x+Math.cos(b.r)*3,b.y+Math.sin(b.r)*3);g.lineTo(b.x-Math.cos(b.r)*3,b.y-Math.sin(b.r)*3);g.stroke()}
  man(pl.x,pl.y,pl.f,pl.p>=0&&(K.l||K.r)&&t%12<6);
  if(pl.h>0){const x=pl.x,y=pl.y;if(t%16<8){R(x-1,y-28,2,14,'#c68642');R(x-6,y-33,12,6,'#adb5bd')}else{R(pl.f>0?x:x-14,y-9,14,2,'#c68642');R(x+pl.f*14-3,y-14,6,10,'#adb5bd')}
   R(6,20,pl.h/6,4,'#ffd166');T((pl.h/60).toFixed(1)+'s',62,26,C3,8,'left')}
  T('PUNKTE '+sc,6,14,C3,10,'left');T('LV '+lv,120,14,C3);T('♥'.repeat(Math.max(0,li)),W-6,14,'#ef476f',10,'right');
  if(st=='over')ov('GAME OVER','A = Neustart');else if(msg>0)ov(mt,'');
 }
 return{i:init,s:step,d:draw,sc:()=>sc}
})();
/* ---------- KLEMPNER RUN (Jump'n'Run, 5 Level) ---------- */
G.pl=(()=>{
 let GR,FL,FX,LW,plats,BX,p,co,en,sk,li,sc,cam=0,st,cp=20,lvl=0,msg=0;
 const TH=[['#8b5a2b','#5aa02c','#6dbf3a','#14213d'],['#2b2d42','#6c757d','#8d99ae','#f4f1de'],['#4a3b52','#7b6d8d','#9a8c98','#f4f1de'],['#6c757d','#e9ecef','#adb5bd','#14213d'],['#3a0f0f','#ff6b35','#ff9f1c','#f4f1de']],NM=['Wiese','Nacht','Höhle','Berge','Vulkan'];
 function bgd(){
  const n=lvl,o=cam*.3;R(0,0,W,H,['#5bc0eb','#14213d','#2d1e3a','#bde0fe','#2a0a12'][n]);
  if(n==0){g.fillStyle='#7ec850';for(let i=-1;i<4;i++){g.beginPath();g.arc(i*110-o%110+30,262,60,Math.PI,0);g.fill()}}
  if(n==1){for(let i=0;i<30;i++)R(i*53%W,i*37%200,1+i%2,1+i%2,'#f4f1de');g.fillStyle='#ffe8a3';g.beginPath();g.arc(190,50,16,0,7);g.fill()}
  if(n==2){for(let y=0;y<260;y+=16){R(0,y,W,1,'#4a3b52');for(let x=-(cam*.5%32)+(y/16%2)*16-32;x<W;x+=32)R(x,y,1,16,'#4a3b52')}}
  if(n==3){for(let i=-1;i<4;i++){const x=i*100-o%100;g.fillStyle='#8d99ae';g.beginPath();g.moveTo(x,260);g.lineTo(x+50,150);g.lineTo(x+100,260);g.fill();g.fillStyle='#fff';g.beginPath();g.moveTo(x+40,168);g.lineTo(x+50,150);g.lineTo(x+60,168);g.fill()}}
  if(n==4){R(0,300,W,20,'#ff6b35');for(let x=0;x<W;x+=12)R(x,298+Math.sin(t/8+x)*2,8,3,'#ff6b35');for(let i=0;i<12;i++)R((i*41+t*.5*(i%3+1))%W,300-(t*(1+i%3)+i*37)%160,2,2,'#ffd166')}
 }
 const rs=()=>{p={x:cp,y:260,vx:0,vy:0,on:1,f:1}};
 function build(n){
  GR=[];FL=[];co=[];en=[];sk=[];let x=0;const gap=38+n*7,segs=3+n;
  for(let s=0;s<segs;s++){
   const w=260+((s*7+n*3)%4)*50,a=x,b=x+w,m=(a+b)/2;GR.push([a,b]);
   FL.push([m-30,205,60-n*5]);co.push({x:m,y:189});
   if(n>=2){FL.push([m+40,165,45]);co.push({x:m+62,y:149})}
   co.push({x:a+w/4,y:228});
   if(s>0){en.push({x:m+(s%2?-60:60),a:a+20,b:b-20,d:1,dead:0,v:.4+n*.15});if(n>=2)en.push({x:m,a:a+20,b:b-20,d:-1,dead:0,v:.4+n*.15});if(n>=1){sk.push(a+w*.65);if(n>=3)sk.push(a+w*.3)}}
   x=b+gap}
  FX=GR[segs-1][1]-40;LW=GR[segs-1][1]+20;
  plats=[...GR.map(a=>[a[0],260,a[1]-a[0]]),...FL];BX=[...GR.map(a=>[a[0],260,a[1]-a[0],60]),...FL.map(a=>[a[0],a[1],a[2],8])];
 }
 function init(){lvl=0;build(0);li=5;cp=20;sc=0;st='play';msg=60;rs()}
 function hit(){li--;if(li<=0)st='over';else rs()}
 function step(){
  if(st!='play'){if(PR.a)init();return}
  if(msg>0){msg--;return}
  p.vx=(K.r-K.l)*1.7;if(K.l)p.f=-1;if(K.r)p.f=1;
  if((PR.a||PR.b)&&p.on){p.vy=-6.6;p.on=0}
  {const nx=Math.max(8,p.x+p.vx);if(!BX.some(([x,y,w,h])=>nx+4>x&&nx-4<x+w&&p.y>y&&p.y-14<y+h))p.x=nx}const py=p.y;p.vy+=(K.a||K.b)&&!p.on?(p.vy<0?.17:.22):.3;p.y+=p.vy;p.on=0;
  if(p.vy<0)for(const[x,y,w,h]of BX)if(p.x+4>x&&p.x-4<x+w&&py-14>=y+h&&p.y-14<y+h){p.y=y+h+14;p.vy=0}
  if(p.vy>=0)for(const[x,y,w]of plats)if(p.x>=x-3&&p.x<=x+w+3&&py<=y+1&&p.y>=y){p.y=y;p.vy=0;p.on=1;break}
  if(p.on&&p.y==260)for(const[a,b]of GR)if(p.x>=a&&p.x<=b)cp=Math.max(cp,a+20);
  if(p.y>H+20)return hit();
  for(const x of sk)if(Math.abs(p.x-x)<5&&p.y>253)return hit();
  for(const e of en){if(e.dead)continue;e.x+=e.d*e.v;if(e.x<e.a||e.x>e.b)e.d*=-1;
   if(Math.abs(p.x-e.x)<9&&p.y>250&&p.y-14<260){if(py<254){e.dead=1;p.vy=-4;sc+=100}else return hit()}}
  co=co.filter(c=>{if(Math.abs(p.x-c.x)<8&&Math.abs(p.y-8-c.y)<10){sc+=10;return 0}return 1});
  if(p.x>=FX){if(lvl<4){lvl++;sc+=200;build(lvl);cp=20;rs();msg=80}else st='win'}
  cam=Math.max(0,Math.min(LW-W,p.x-100));
 }
 function draw(){
